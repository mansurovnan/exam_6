<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete {{ category.name }} | Blog Platform</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            color: #e2e8f0;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(30, 64, 175, 0.25),
                    transparent 40%
                ),
                #020617;
        }

        .card {
            width: 100%;
            max-width: 500px;

            padding: 40px;

            text-align: center;

            background: #0f172a;

            border: 1px solid #1e293b;

            border-radius: 22px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(239, 68, 68, 0.12);

            border: 1px solid rgba(239, 68, 68, 0.25);

            color: #f87171;

            font-size: 30px;
        }

        h1 {
            margin-bottom: 12px;

            color: white;

            font-size: 28px;
        }

        .text {
            margin-bottom: 10px;

            color: #94a3b8;

            line-height: 1.6;
        }

        .category-name {
            margin-bottom: 30px;

            color: #60a5fa;

            font-size: 18px;

            font-weight: 700;
        }

        .warning {
            margin-bottom: 30px;

            padding: 13px;

            border-radius: 10px;

            background: rgba(239, 68, 68, 0.08);

            border: 1px solid rgba(239, 68, 68, 0.15);

            color: #fca5a5;

            font-size: 13px;
        }

        .actions {
            display: flex;

            gap: 12px;
        }

        .btn {
            flex: 1;

            padding: 14px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;
        }

        .cancel {
            background: #1e293b;

            border: 1px solid #334155;

            color: #cbd5e1;
        }

        .cancel:hover {
            border-color: #475569;
        }

        .delete {
            border: none;

            background: #dc2626;

            color: white;
        }

        .delete:hover {
            background: #b91c1c;
        }

        @media (max-width: 500px) {

            .card {
                padding: 30px 20px;
            }

            .actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="card">


    <div class="icon">
        !
    </div>


    <h1>
        Delete Category?
    </h1>


    <p class="text">
        Are you sure you want to delete this category?
    </p>


    <div class="category-name">
        {{ category.name }}
    </div>


    <div class="warning">
        This action cannot be undone.
        All information related to this category
        may be permanently removed.
    </div>


    <form
        method="POST"
    >

        {% csrf_token %}


        <div class="actions">

            <a
                href="{% url 'category_detail' category.pk %}"
                class="btn cancel"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="btn delete"
            >
                Yes, Delete
            </button>

        </div>

    </form>


</div>


</body>

</html>
