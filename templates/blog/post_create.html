<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Post | Blog Platform</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            color: #e2e8f0;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(30, 64, 175, 0.30),
                    transparent 40%
                ),
                #020617;
        }


        /* NAVBAR */

        .navbar {
            height: 75px;

            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(2, 6, 23, 0.95);

            border-bottom: 1px solid #1e293b;
        }


        .logo {
            color: white;

            font-size: 24px;

            font-weight: 800;
        }


        .logo span {
            color: #3b82f6;
        }


        .nav-links {
            display: flex;

            align-items: center;

            gap: 25px;
        }


        .nav-links a {
            color: #94a3b8;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }


        .nav-links a:hover {
            color: #60a5fa;
        }


        .logout {
            padding: 9px 17px;

            background: #1e293b;

            border: 1px solid #334155;

            border-radius: 9px;

            color: #cbd5e1 !important;
        }


        /* CONTAINER */

        .container {
            width: 90%;

            max-width: 800px;

            margin: 60px auto;
        }


        .back {
            display: inline-block;

            margin-bottom: 25px;

            color: #60a5fa;

            text-decoration: none;

            font-size: 14px;
        }


        .back:hover {
            color: #93c5fd;
        }


        .header {
            margin-bottom: 30px;
        }


        .header h1 {
            color: white;

            font-size: 38px;

            margin-bottom: 10px;
        }


        .header p {
            color: #64748b;

            font-size: 15px;
        }


        /* FORM CARD */

        .form-card {
            padding: 35px;

            background: #0f172a;

            border: 1px solid #1e293b;

            border-radius: 20px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);
        }


        /* DJANGO FORM */

        form p {
            margin-bottom: 22px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;

            font-weight: 600;
        }


        input[type="text"],
        textarea,
        select,
        input[type="file"] {

            width: 100%;

            padding: 13px;

            background: #020617;

            border: 1px solid #334155;

            border-radius: 10px;

            color: white;

            outline: none;

            font-size: 14px;

        }


        textarea {
            min-height: 220px;

            resize: vertical;

            line-height: 1.6;
        }


        select {
            cursor: pointer;
        }


        input[type="file"] {
            padding: 11px;

            cursor: pointer;
        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(
                    59,
                    130,
                    246,
                    0.12
                );

        }


        /* ERRORS */

        .errorlist {

            margin-bottom: 7px;

            color: #f87171;

            list-style: none;

            font-size: 13px;
        }


        /* HELP TEXT */

        .helptext {

            display: block;

            margin-top: 6px;

            color: #64748b;

            font-size: 12px;
        }


        /* BUTTONS */

        .actions {

            display: flex;

            gap: 12px;

            margin-top: 30px;
        }


        .btn {

            flex: 1;

            padding: 14px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

        }


        .publish-btn {

            border: none;

            background: #2563eb;

            color: white;
        }


        .publish-btn:hover {

            background: #1d4ed8;
        }


        .cancel-btn {

            border: 1px solid #334155;

            color: #cbd5e1;
        }


        .cancel-btn:hover {

            border-color: #3b82f6;

            color: #60a5fa;
        }


        /* RESPONSIVE */

        @media (max-width: 650px) {

            .navbar {
                padding: 0 20px;
            }


            .nav-links {
                gap: 10px;
            }


            .nav-links a:not(.logout) {
                display: none;
            }


            .form-card {
                padding: 25px 20px;
            }


            .header h1 {
                font-size: 30px;
            }


            .actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">


    <div class="logo">

        Blog<span>Platform</span>

    </div>


    <div class="nav-links">


        <a href="{% url 'home' %}">
            Home
        </a>


        <a href="{% url 'category_list' %}">
            Categories
        </a>


        <a href="{% url 'post_list' %}">
            Posts
        </a>


        {% if user.is_authenticated %}

            <a href="{% url 'profile' %}">
                Profile
            </a>


            <a
                href="{% url 'logout' %}"
                class="logout"
            >
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

        {% endif %}


    </div>


</nav>


<!-- MAIN -->

<main class="container">


    <a
        href="{% url 'post_list' %}"
        class="back"
    >
        ← Back to Posts
    </a>


    <div class="header">

        <h1>
            Create New Post
        </h1>


        <p>
            Share your ideas, knowledge and stories
            with the community.
        </p>

    </div>


    <div class="form-card">


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            {{ form.as_p }}


            <div class="actions">


                <button
                    type="submit"
                    class="btn publish-btn"
                >
                    Publish Post
                </button>


                <a
                    href="{% url 'post_list' %}"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>


            </div>


        </form>


    </div>


</main>


</body>

</html>
