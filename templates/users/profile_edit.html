<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Blog Platform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #e2e8f0;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(30, 64, 175, 0.35),
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(37, 99, 235, 0.20),
                    transparent 35%
                ),
                #020617;

            padding-bottom: 50px;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 75px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(2, 6, 23, 0.96);
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: white;
        }

        .logo span {
            color: #3b82f6;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .logout-btn {
            padding: 9px 17px;

            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 9px;

            color: #cbd5e1 !important;
        }

        .logout-btn:hover {
            border-color: #2563eb;
            background: #172554;
        }

        /* ================= MAIN ================= */

        .container {
            width: 100%;
            max-width: 700px;

            margin: 60px auto;
            padding: 0 25px;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title h1 {
            color: white;
            font-size: 36px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
            font-size: 15px;
        }

        /* ================= FORM CARD ================= */

        .form-card {
            background: rgba(15, 23, 42, 0.95);

            border: 1px solid #1e293b;
            border-radius: 20px;

            padding: 35px;

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        /* Django form */

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;
            font-weight: 600;
        }

        form input,
        form textarea,
        form select {
            width: 100%;

            padding: 13px 14px;

            background: #020617;

            border: 1px solid #334155;
            border-radius: 10px;

            color: white;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .helptext {
            display: block;

            margin-top: 6px;

            color: #475569;

            font-size: 12px;
        }

        .errorlist {
            list-style: none;

            margin-bottom: 7px;

            color: #f87171;

            font-size: 13px;
        }

        /* ================= BUTTONS ================= */

        .actions {
            display: flex;
            gap: 12px;

            margin-top: 30px;
        }

        .save-btn {
            flex: 1;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #1d4ed8,
                #2563eb
            );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .save-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 25px rgba(37, 99, 235, 0.30);
        }

        .cancel-btn {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 14px;

            border: 1px solid #334155;
            border-radius: 10px;

            color: #cbd5e1;

            text-decoration: none;

            font-size: 15px;
            font-weight: 600;

            transition: 0.2s;
        }

        .cancel-btn:hover {
            border-color: #3b82f6;
            color: #60a5fa;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a:not(.logout-btn) {
                display: none;
            }

            .container {
                margin-top: 35px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .page-title h1 {
                font-size: 28px;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        Blog<span>Platform</span>
    </div>

    <div class="nav-links">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'logout' %}" class="logout-btn">
            Logout
        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<main class="container">

    <div class="page-title">

        <h1>
            Edit Profile
        </h1>

        <p>
            Update your personal information.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="actions">

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

                <a
                    href="{% url 'profile' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
