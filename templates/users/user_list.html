<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | BlogPlatform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #e2e8f0;
            background: radial-gradient(circle at top left, rgba(30, 64, 175, .3), transparent 40%), #020617;
        }

        .navbar {
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #020617;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: #3b82f6;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 60px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #60a5fa;
            text-decoration: none;
        }

        h1 {
            color: white;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 40px;
        }

        .users {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .user-card {
            display: block;
            padding: 25px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 18px;
            text-decoration: none;
            color: inherit;
            transition: .2s;
        }

        .user-card:hover {
            border-color: #2563eb;
            transform: translateY(-3px);
        }

        .username {
            color: white;
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .email {
            color: #64748b;
            margin-bottom: 20px;
        }

        .posts {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(59, 130, 246, .1);
            color: #60a5fa;
            font-size: 13px;
        }

        .arrow {
            float: right;
            color: #60a5fa;
            font-size: 20px;
        }

        .empty {
            color: #64748b;
        }

        @media (max-width: 700px) {
            .users {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 0 20px;
            }

            .nav-links a:not(:last-child) {
                display: none;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Blog<span>Platform</span>
    </div>

    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'category_list' %}">Categories</a>
        <a href="{% url 'post_list' %}">Posts</a>
        <a href="{% url 'user_list' %}">Users</a>
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

</nav>

<main class="container">

    <a href="{% url 'home' %}" class="back">
        ← Back to Home
    </a>

    <h1>Our Users</h1>

    <p class="subtitle">
        Discover the writers in our community.
    </p>

    <div class="users">

        {% for user in users %}

            <a href="{% url 'user_posts' user.pk %}" class="user-card">

                <div class="username">
                    {{ user.username }}
                </div>

                <div class="email">
                    {{ user.email }}
                </div>

                <span class="posts">
                    {{ user.post_count }} Posts
                </span>

                <span class="arrow">
                    →
                </span>

            </a>

        {% empty %}

            <p class="empty">
                No users found.
            </p>

        {% endfor %}

    </div>

</main>

</body>
</html>
